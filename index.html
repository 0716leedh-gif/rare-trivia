<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RARE SCHOOL</title>
<style>
:root{--bg:#070b14;--panel:#0d162b;--line:#33476f;--text:#f5f7ff;--muted:#94a6c8;--cyan:#67e5ff;--pink:#ff6b9f;--gold:#ffd76a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:58px;background:#0d1430;border-bottom:1px solid #2b3d62;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand{font-weight:1000;letter-spacing:.08em}.brand span{color:var(--cyan)}.nav{display:flex;gap:8px}.nav button{background:#121b35;border:1px solid #2a3c66;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.game{padding:12px}.layout{max-width:1600px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}.card{background:#0a1122;border:1px solid #354970;border-radius:16px;overflow:hidden}.scene{position:relative;aspect-ratio:768/422;background:#101728;overflow:hidden}.scene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}.shade{position:absolute;inset:0;background:linear-gradient(#05091210,#05091218);z-index:1}.board{position:absolute;left:38.7%;top:14%;width:50.4%;height:36%;background:#153e36ec;border:3px solid #765238;border-radius:9px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4%;z-index:5}.cat{position:absolute;top:8%;font-size:clamp(8px,1vw,14px);letter-spacing:.12em;color:#d5f3e1}.q{font-size:clamp(18px,3vw,42px);font-weight:1000;line-height:1.25}.bubble{position:absolute;left:25.8%;top:13.5%;width:16%;padding:10px;background:#172448ef;border:2px solid #b8c8ef;border-radius:13px;text-align:center;font-weight:900;z-index:8}.bubble b{color:var(--gold)}.seat{position:absolute;top:56%;height:36%;width:13.2%;border:3px solid transparent;border-radius:12px;z-index:7}.seat.active{border-color:#ffe16a;box-shadow:0 0 0 3px #ff9b3977,0 0 28px #ffb33fcc,inset 0 0 24px #ffd86a30}.seat.dead{background:#04071199;filter:grayscale(1)}.face{position:absolute;inset:0 0 42% 0;background:radial-gradient(circle at 50% 35%,#ff4a5c66 0 18%,transparent 58%);opacity:0}.active .face.warn{opacity:.55}.active .face.hot{opacity:1}.sweat{position:absolute;top:2%;right:8%;font-size:clamp(14px,2vw,28px);opacity:0}.active .sweat.show{opacity:1}.arrow{position:absolute;top:-14%;left:50%;transform:translateX(-50%);font-size:clamp(22px,3vw,48px);color:#ffd34c;opacity:0;text-shadow:0 0 12px #ffd34c}.active .arrow{opacity:1;animation:bob .5s infinite alternate}.name{position:absolute;left:3%;right:3%;bottom:2%;padding:5px;background:#101936ee;border:1px solid #4a5f89;border-radius:7px;text-align:center;font-size:clamp(8px,1vw,12px);font-weight:900}.life{display:block;color:#ff789f}.teacherHeat{position:absolute;left:25%;top:25%;width:18%;height:30%;border-radius:50%;opacity:0;background:radial-gradient(circle,#ff3e3e55,transparent 70%);z-index:6}.teacherHeat.hot{opacity:.75}.teacherHeat.angry{opacity:1;animation:shake .08s 8}.gaugeBox{position:absolute;left:1%;bottom:2%;width:20%;padding:7px;background:#101831dd;border:1px solid #334a73;border-radius:9px;z-index:12;font-size:10px}.gauge{height:7px;background:#080e1d;border-radius:999px;overflow:hidden;margin-top:4px}.fill{height:100%;background:linear-gradient(90deg,#ffd34e,#ff7e5e)}.splash{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:13px 20px;min-width:220px;background:#0a1025ee;border:2px solid #4a5f92;border-radius:14px;text-align:center;z-index:15;opacity:0}.splash.show{animation:splash 1s ease}.splash strong{display:block;font-size:clamp(20px,3vw,40px)}.dock{display:grid;grid-template-columns:100px 1fr 105px;gap:10px;padding:12px;background:#0a1122;border-top:1px solid #2f4168;align-items:center}.timer{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) var(--pct),#182444 0);position:relative}.timer:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#101a33}.timer b{z-index:1;font-size:25px}.ans{background:#0d1730;border:1px solid #3b4f79;border-radius:12px;color:#fff;padding:15px;font-size:17px}.submit{border:0;border-radius:12px;padding:15px;background:linear-gradient(90deg,#f95d92,#ff846e);color:#fff;font-weight:1000}.side{display:grid;gap:10px;align-content:start}.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.box h3{margin:0 0 10px;font-size:11px;letter-spacing:.12em}.log{display:grid;gap:7px;max-height:300px;overflow:auto}.logItem{padding:9px;border:1px solid #293d64;background:#0a1225;border-radius:9px;font-size:11px}.prow{display:grid;grid-template-columns:22px 1fr auto;gap:7px;padding:7px;border:1px solid #26395f;border-radius:8px;font-size:11px;margin-bottom:5px}.prow.current{border-color:#ffda56}.prow.dead{opacity:.4}.rar{font-weight:1000}.COMMON{color:#eee}.UNCOMMON{color:#6cf0ae}.RARE{color:#6fb6ff}.EPIC{color:#d58dff}.UNIQUE,.ONE{color:#ffd76a}.result{position:fixed;inset:0;background:#050815dd;display:none;place-items:center;z-index:50}.result.show{display:grid}.resultBox{width:min(500px,92vw);background:#10182f;border:1px solid #43557d;border-radius:22px;padding:30px;text-align:center}.pri{border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(90deg,#f95d92,#ff846e);color:#fff;font-weight:1000}@keyframes bob{from{transform:translate(-50%,0)}to{transform:translate(-50%,-6px)}}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}@keyframes splash{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}}@media(max-width:700px){.nav{display:none}.dock{grid-template-columns:70px 1fr 80px}.timer{width:62px;height:62px}.timer:before{inset:6px}.timer b{font-size:18px}.ans,.submit{padding:11px;font-size:13px}.side{grid-template-columns:1fr}}</style>
<script src="assets/scene.js"></script></head><body><header class="top"><div class="brand">RARE <span>SCHOOL</span></div><div class="nav"><button>홈</button><button>게임</button><button>커스터마이징</button><button>기록</button></div></header><main class="game"><div class="layout"><section class="card"><div class="scene"><img id="sceneImg" class="bg" alt="교실"><div class="shade"></div><div class="board"><div id="cat" class="cat"></div><div id="question" class="q"></div></div><div id="bubble" class="bubble"></div><div id="teacherHeat" class="teacherHeat"></div><div class="gaugeBox">⚡ 게이지 <span id="gaugeText" style="float:right">0 / 100</span><div class="gauge"><div id="gaugeFill" class="fill" style="width:0"></div></div></div><div id="splash" class="splash"><strong id="spA"></strong><span id="spR" class="rar"></span></div><div id="seatLayer"></div></div><form id="form" class="dock"><div id="timer" class="timer" style="--pct:100%"><b id="time">10.0</b></div><input id="answer" class="ans" autocomplete="off" placeholder="답을 입력하세요..."><button class="submit">제출</button></form></section><aside class="side"><div class="box"><h3>CLASS LOG</h3><div id="log" class="log"></div></div><div class="box"><h3>학생 상태</h3><div id="plist"></div></div><div class="box"><h3>규칙</h3><div style="font-size:11px;color:var(--muted);line-height:1.7">10초 안에 유효한 답을 입력.<br>오답·중복은 시간 계속.<br>시간 초과 시 ❤️ -1.<br>희귀답변은 게이지 증가.<br>마지막 2명은 FINAL DUEL.</div></div></aside></div></main><div id="result" class="result"><div class="resultBox"><div style="font-size:54px">🏆</div><h1 id="winner"></h1><p>마지막까지 살아남은 학생</p><button class="pri" onclick="restart()">다시 시작</button></div></div>
<script>
document.getElementById('sceneImg').src=window.RARE_SCENE||'';
const Q=[{c:'카테고리 1 · K-POP',q:'한국 아이돌 그룹을 말하세요!',a:[['방탄소년단',['방탄소년단','방탄','bts'],'COMMON'],['블랙핑크',['블랙핑크','blackpink'],'COMMON'],['에스파',['에스파','aespa'],'COMMON'],['뉴진스',['뉴진스','newjeans'],'COMMON'],['세븐틴',['세븐틴','seventeen'],'UNCOMMON'],['아이브',['아이브','ive'],'UNCOMMON'],['트와이스',['트와이스','twice'],'UNCOMMON'],['샤이니',['샤이니','shinee'],'RARE'],['비투비',['비투비','btob'],'RARE'],['틴탑',['틴탑','teentop'],'EPIC'],['나인뮤지스',['나인뮤지스','9muses'],'EPIC'],['크나큰',['크나큰','knk'],'UNIQUE']]},{c:'카테고리 2 · FOOD',q:'한국 라면 제품을 말하세요!',a:[['신라면',['신라면'],'COMMON'],['짜파게티',['짜파게티'],'COMMON'],['진라면',['진라면'],'COMMON'],['너구리',['너구리'],'UNCOMMON'],['팔도비빔면',['팔도비빔면','비빔면'],'UNCOMMON'],['꼬꼬면',['꼬꼬면'],'RARE'],['참깨라면',['참깨라면'],'RARE'],['오징어짬뽕',['오징어짬뽕'],'EPIC'],['무파마',['무파마','무파마탕면'],'UNIQUE']]},{c:'카테고리 3 · WORLD',q:'나라 이름을 하나 말하세요!',a:[['대한민국',['대한민국','한국','korea'],'COMMON'],['미국',['미국','usa','america'],'COMMON'],['일본',['일본','japan'],'COMMON'],['중국',['중국','china'],'COMMON'],['필리핀',['필리핀','philippines'],'UNCOMMON'],['베트남',['베트남','vietnam'],'UNCOMMON'],['몽골',['몽골','mongolia'],'RARE'],['네팔',['네팔','nepal'],'RARE'],['부탄',['부탄','bhutan'],'EPIC'],['몰도바',['몰도바','moldova'],'EPIC'],['투발루',['투발루','tuvalu'],'UNIQUE']]}],PTS={COMMON:5,UNCOMMON:10,RARE:15,EPIC:20,UNIQUE:25},XS=[8.3,24.6,40.7,56.8,73.1,89.3];
let ps=[['민준',1],['서연',1],['학생0716',0],['지훈',1],['다연',1],['승현',1]].map(([name,bot])=>({name,bot,lives:2,gauge:0,dead:false})),turn=2,qi=0,used=new Set(),claimed=new Set(),deadline=0,timerId,locked=false,fails=0,catStart=Date.now(),duelStart=0;const $=x=>document.getElementById(x),norm=s=>(s||'').toLowerCase().replace(/[\s\-_.·'"()]/g,'');
function alive(){return ps.filter(p=>!p.dead)}function next(i){do{i=(i+1)%ps.length}while(ps[i].dead&&alive().length>1);return i}function hearts(n){return'❤️'.repeat(Math.max(0,n))+'🖤'.repeat(Math.max(0,3-n))}
function renderSeats(){const L=$('seatLayer');L.innerHTML='';ps.forEach((p,i)=>{const e=document.createElement('div');e.className='seat'+(i===turn&&!p.dead?' active':'')+(p.dead?' dead':'');e.style.left=`calc(${XS[i]}% - 6.6%)`;e.innerHTML=`<div id="f${i}" class="face"></div><div id="s${i}" class="sweat">💦</div><div class="arrow">▼</div><div class="name">${i+1} ${p.name}<span class="life">${hearts(p.lives)}</span></div>`;L.appendChild(e)})}
function renderSide(){$('plist').innerHTML=ps.map((p,i)=>`<div class="prow ${i===turn&&!p.dead?'current':''} ${p.dead?'dead':''}"><span>${i+1}</span><b>${p.name}</b><span>${hearts(p.lives)}</span></div>`).join('');let me=ps[2];$('gaugeText').textContent=`${me.gauge} / 100`;$('gaugeFill').style.width=Math.min(100,me.gauge)+'%'}
function render(){$('cat').textContent=Q[qi].c;$('question').textContent=Q[qi].q;$('bubble').innerHTML=`지금은<br><b>${turn+1}번 ${ps[turn].name}</b>의 차례!`;renderSeats();renderSide();$('answer').disabled=ps[turn].bot||ps[2].dead}
function mood(left){let f=$('f'+turn),s=$('s'+turn),t=$('teacherHeat');if(f)f.className='face'+(left<=3?' hot':left<=6?' warn':'');if(s)s.className='sweat'+(left<=6?' show':'');t.className='teacherHeat'+(left<=2.5?' angry':left<=5?' hot':'')}
function startTurn(){if(alive().length<=1)return finish();if(Date.now()-catStart>60000||fails>=3){qi=(qi+1)%Q.length;used.clear();fails=0;catStart=Date.now()}let final=alive().length===2;if(final&&!duelStart)duelStart=Date.now();let dur=final?(Date.now()-duelStart>60000?5000:7000):10000;locked=false;deadline=performance.now()+dur;$('answer').value='';render();clearInterval(timerId);timerId=setInterval(tick,40);if(ps[turn].bot)setTimeout(bot,900+Math.random()*1800);else $('answer').focus()}
function tick(){let total=alive().length===2?(Date.now()-duelStart>60000?5:7):10,left=Math.max(0,(deadline-performance.now())/1000);$('time').textContent=left.toFixed(1);$('timer').style.setProperty('--pct',Math.max(0,Math.min(100,left/total*100))+'%');mood(left);if(left<=0)timeout()}
function addLog(n,a,r,e=''){$('log').insertAdjacentHTML('afterbegin',`<div class="logItem"><b>${n}</b> · ${a}<div class="rar ${r}">${r==='ONE'?'THE ONE AND ONLY':r}</div>${e?`<small>${e}</small>`:''}</div>`)}function splash(a,r,p){$('spA').textContent=a;$('spR').textContent=`${r}${p?` · +${p} ⚡`:''}`;$('spR').className='rar '+(r==='THE ONE AND ONLY'?'ONE':r);let s=$('splash');s.classList.remove('show');void s.offsetWidth;s.classList.add('show')}
function timeout(){if(locked)return;locked=true;clearInterval(timerId);let p=ps[turn];if(p.lives===3&&p.gauge>=100){p.gauge=0}else{p.lives--;if(p.lives<=0)p.dead=true}fails++;$('teacherHeat').className='teacherHeat angry';splash('시간 초과!','LIFE -1',0);addLog(p.name,'TIME OUT','COMMON','선생님이 화냈다');render();setTimeout(()=>{turn=next(turn);startTurn()},1100)}
function find(v){let n=norm(v);return Q[qi].a.find(a=>a[1].some(x=>norm(x)===n))}function gain(p,n){p.gauge+=n;if(p.lives<3&&p.gauge>=100){p.gauge-=100;p.lives++}if(p.lives===3)p.gauge=Math.min(100,p.gauge)}
function accept(a){let p=ps[turn],[name,al,r]=a;used.add(name);let pts=PTS[r],label=r;if(r==='UNIQUE'&&!claimed.has(name)){claimed.add(name);pts=50;label='THE ONE AND ONLY'}gain(p,pts);fails=0;splash(name,label,pts);addLog(p.name,name,label==='THE ONE AND ONLY'?'ONE':label);render()}
function submit(v){if(locked||ps[turn].bot)return;let a=find(v);if(!a){splash('오답','시간은 계속',0);$('answer').select();return}if(used.has(a[0])){splash('이미 나온 답','다른 답 입력',0);$('answer').select();return}locked=true;clearInterval(timerId);accept(a);setTimeout(()=>{turn=next(turn);startTurn()},900)}
function bot(){if(locked||!ps[turn].bot)return;if(Math.random()<.16)return;let pool=Q[qi].a.filter(a=>!used.has(a[0]));if(!pool.length)return;locked=true;clearInterval(timerId);accept(pool[Math.floor(Math.random()*pool.length)]);setTimeout(()=>{turn=next(turn);startTurn()},900)}function finish(){clearInterval(timerId);$('winner').textContent=(alive()[0]||ps[2]).name+' 우승';$('result').classList.add('show')}function restart(){location.reload()}$('form').addEventListener('submit',e=>{e.preventDefault();submit($('answer').value.trim())});render();startTurn();
</script></body></html>
