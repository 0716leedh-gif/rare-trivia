<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RARE SCHOOL</title><style>
:root{--bg:#060a12;--panel:#0e1730;--line:#344970;--cyan:#64e7ff;--gold:#ffd35c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:54px;background:#0b1330;border-bottom:1px solid #283a61;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand{font-weight:1000;letter-spacing:.12em}.brand span{color:var(--cyan)}.nav{display:flex;gap:8px}.nav button{background:#111c39;border:1px solid #2c406b;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800}.shell{max-width:1660px;margin:auto;padding:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}.gamecard{background:#0a1121;border:1px solid #31466f;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #0008}.scene{position:relative;aspect-ratio:16/9;min-height:650px;background:#c5d8ea;overflow:hidden}.bg{position:absolute;inset:0;background-image:linear-gradient(#ffffff18,#00000018),url('assets/classroom.webp');background-size:cover;background-position:center;filter:saturate(.92) brightness(.82)}.vignette{position:absolute;inset:0;background:linear-gradient(180deg,#08111b10 0%,transparent 34%,#08101e1d 68%,#08101eb8 100%)}.board{position:absolute;left:31%;top:7.5%;width:56%;height:28%;background:linear-gradient(#154637,#103a2f);border:10px solid #805936;border-radius:8px;box-shadow:inset 0 0 0 2px #51705f,0 8px 22px #0004;z-index:6;display:flex;align-items:center;justify-content:center;padding:4.5%;text-align:center}.cat{position:absolute;top:8%;font-size:clamp(9px,.85vw,14px);letter-spacing:.2em;color:#b8ebd0;font-weight:900}.q{font-size:clamp(20px,2.5vw,42px);line-height:1.22;font-weight:1000;color:#f0fff6}.teacherZone{position:absolute;left:4%;top:10%;width:23%;height:47%;z-index:9;display:flex;align-items:flex-end;justify-content:center}.teacherSpeech{position:absolute;top:0;left:48%;min-width:165px;padding:10px 14px;border-radius:12px;background:#111a36ee;border:2px solid #aab8df;text-align:center;font-size:clamp(11px,.9vw,15px);font-weight:900}.teacherSpeech b{color:var(--gold)}.teacher{width:80%;max-width:220px;filter:drop-shadow(0 10px 8px #0006);transform-origin:50% 100%}.teacher svg{width:100%;overflow:visible}.teacher .cheek,.teacher .anger,.teacher .shout,.teacher .stress,.teacher .browAngry{opacity:0}.teacher.warn .cheek,.teacher.warn .stress{opacity:.8}.teacher.angry{animation:tshake .08s 8}.teacher.angry .cheek,.teacher.angry .anger,.teacher.angry .shout,.teacher.angry .browAngry{opacity:1}.teacher.angry .mouthCalm{opacity:0}.teacher .pointer,.teacher .armPoint{transform-origin:102px 131px;transition:.15s}.teacher.point-left .armPoint,.teacher.point-left .pointer{transform:rotate(-18deg)}.teacher.point-right .armPoint,.teacher.point-right .pointer{transform:rotate(18deg)}.teacher.warn .pointer{transform:rotate(-5deg)}.teacher.angry .pointer{transform:rotate(8deg)}.seats{position:absolute;left:2%;right:2%;bottom:9.2%;height:39%;z-index:12;display:grid;grid-template-columns:repeat(6,1fr);gap:.7%;align-items:end}.seat{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;transition:.18s}.seat.dead{filter:grayscale(1);opacity:.35}.seat.active{transform:translateY(-10px)}.seat.active:before{content:"";position:absolute;left:7%;right:7%;top:14%;bottom:0;border:3px solid var(--gold);border-radius:18px;box-shadow:0 0 0 3px #ff9d3d55,0 0 30px #ffd35c99;animation:pulse 1s infinite alternate}.marker{position:absolute;top:5%;left:50%;transform:translateX(-50%);font-size:clamp(22px,2.5vw,44px);color:#ffd84f;text-shadow:0 0 12px #ffb62a;opacity:0;z-index:5}.seat.active .marker{opacity:1;animation:bob .45s infinite alternate}.studentWrap{width:84%;max-width:175px;position:relative;z-index:2;transform-origin:50% 100%;filter:drop-shadow(0 8px 8px #0004)}.studentWrap svg{width:100%;overflow:visible}.deskLayer{position:absolute;left:3%;right:3%;bottom:0;height:37%;z-index:4}.deskSvg{width:100%;height:100%}.studentWrap .blush,.studentWrap .sweat,.studentWrap .panic,.studentWrap .happy,.studentWrap .failEyes{opacity:0}.seat.nervous .studentWrap{animation:nervous .22s infinite alternate}.seat.nervous .studentWrap .sweat{opacity:1}.seat.hot .studentWrap{animation:hotshake .11s infinite alternate}.seat.hot .studentWrap .sweat,.seat.hot .studentWrap .blush,.seat.hot .studentWrap .panic{opacity:1}.seat.hot .studentWrap .normalMouth{opacity:0}.seat.correct .studentWrap{animation:jump .45s ease}.seat.correct .studentWrap .happy{opacity:1}.seat.correct .studentWrap .normalEyes,.seat.correct .studentWrap .normalMouth{opacity:0}.seat.fail .studentWrap{animation:fail .6s ease}.seat.fail .studentWrap .failEyes{opacity:1}.seat.fail .studentWrap .normalEyes,.seat.fail .studentWrap .normalMouth{opacity:0}.nameplate{position:absolute;left:4%;right:4%;bottom:-2%;background:#101a38ee;border:1px solid #455a83;border-radius:9px;padding:5px 4px;text-align:center;font-weight:900;font-size:clamp(9px,.75vw,13px);z-index:9}.life{display:block;color:#ff7a9f;letter-spacing:1px}.bubbleResult{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);z-index:20;min-width:260px;padding:15px 20px;border-radius:14px;background:#0b1226ee;border:2px solid #506998;text-align:center;opacity:0}.bubbleResult.show{animation:resultpop 1.05s ease}.bubbleResult strong{display:block;font-size:clamp(24px,3vw,46px)}.rar{font-weight:1000;letter-spacing:.08em}.COMMON{color:#eee}.UNCOMMON{color:#6ef1ad}.RARE{color:#69b7ff}.EPIC{color:#d68eff}.UNIQUE,.ONE{color:#ffd666}.gaugeBox{position:absolute;left:1.3%;bottom:1.6%;z-index:16;width:19%;padding:8px 10px;background:#0d1630e8;border:1px solid #40557d;border-radius:10px;font-size:10px}.gauge{height:7px;background:#091024;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;background:linear-gradient(90deg,#ffd65b,#ff7b69)}.dock{display:grid;grid-template-columns:96px 1fr 110px;gap:10px;padding:12px;background:#091121;border-top:1px solid #2e426c;align-items:center}.timer{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--cyan) var(--pct),#182442 0)}.timer:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#0d1730}.timer b{z-index:1;font-size:24px}.ans{background:#0c1730;border:1px solid #3b507a;color:#fff;border-radius:12px;padding:15px;font-size:17px}.submit{border:0;border-radius:12px;padding:15px;background:linear-gradient(90deg,#ff5e92,#ff846d);color:#fff;font-weight:1000}.side{display:grid;gap:10px;align-content:start}.box{background:#0e1730;border:1px solid #344970;border-radius:14px;padding:14px}.box h3{font-size:11px;letter-spacing:.13em;margin:0 0 10px}.prow{display:grid;grid-template-columns:22px 1fr auto;gap:7px;padding:7px;border:1px solid #293d64;border-radius:8px;font-size:11px;margin-bottom:5px}.prow.current{border-color:#ffd45c}.prow.dead{opacity:.35}.log{display:grid;gap:7px;max-height:320px;overflow:auto}.logItem{padding:9px;border:1px solid #293d64;background:#091224;border-radius:9px;font-size:11px}.rule{font-size:11px;color:#9db0d0;line-height:1.8}.overlay{position:fixed;inset:0;background:#050816dd;display:none;place-items:center;z-index:50}.overlay.show{display:grid}.resultBox{width:min(500px,92vw);background:#101931;border:1px solid #42567d;border-radius:22px;padding:30px;text-align:center}.primary{border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(90deg,#ff5e92,#ff846d);color:#fff;font-weight:1000}@keyframes bob{to{transform:translate(-50%,-7px)}}@keyframes pulse{to{box-shadow:0 0 0 5px #ff9d3d44,0 0 42px #ffd35ccc}}@keyframes nervous{to{transform:translateX(1.8px)}}@keyframes hotshake{to{transform:translateX(-2.2px) rotate(-.5deg)}}@keyframes jump{45%{transform:translateY(-22px)}}@keyframes fail{30%{transform:translateX(-7px) rotate(-3deg)}60%{transform:translateX(7px) rotate(3deg)}}@keyframes tshake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}@keyframes resultpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}18%,78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}@media(max-width:1050px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.scene{min-height:560px}}@media(max-width:760px){.nav{display:none}.scene{min-height:460px}.board{left:28%;width:66%;top:6%;height:29%}.teacherZone{left:1%;width:27%}.seats{overflow-x:auto;grid-template-columns:repeat(6,150px);left:0;right:0;padding:0 8px}.dock{grid-template-columns:70px 1fr 82px}.timer{width:62px;height:62px}.timer:before{inset:6px}.timer b{font-size:18px}.ans,.submit{padding:11px;font-size:13px}.side{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand">RARE <span>SCHOOL</span></div><div class="nav"><button>홈</button><button>게임</button><button>커스터마이징</button><button>기록</button></div></header><main class="shell"><div class="layout"><section class="gamecard"><div class="scene"><div class="bg"></div><div class="vignette"></div><div class="board"><div id="cat" class="cat"></div><div id="question" class="q"></div></div><div class="teacherZone"><div id="teacherSpeech" class="teacherSpeech">지금은 <b>3번</b> 차례!</div><div id="teacher" class="teacher calm"><svg viewBox="0 0 180 245"><g stroke="#241b22" stroke-width="5" stroke-linejoin="round"><ellipse cx="86" cy="65" rx="47" ry="48" fill="#f2c9a7"/><path d="M42 62Q44 15 88 14Q132 15 137 58Q117 38 96 40Q76 41 56 58Z" fill="#3b3440"/><path d="M53 44Q72 19 102 22Q122 25 135 47Q116 32 94 34Q70 35 53 44Z" fill="#504754"/><rect x="45" y="58" width="38" height="30" rx="6" fill="#f7f0e8"/><rect x="89" y="58" width="38" height="30" rx="6" fill="#f7f0e8"/><path d="M83 72h6"/><circle cx="65" cy="72" r="4" fill="#1d1a1f"/><circle cx="108" cy="72" r="4" fill="#1d1a1f"/><path class="browAngry" d="M54 57l22-7M98 50l22 7" stroke="#6b2027"/><path class="mouthCalm" d="M78 96q10 9 20 0" fill="none"/><path class="shout" d="M76 94q12-12 25 0q-12 17-25 0Z" fill="#7f2a31"/><ellipse class="cheek" cx="58" cy="89" rx="12" ry="7" fill="#ff7777" stroke="none"/><ellipse class="cheek" cx="118" cy="89" rx="12" ry="7" fill="#ff7777" stroke="none"/><path d="M55 116Q88 100 121 117L132 192Q92 208 45 190Z" fill="#e5cda5"/><path d="M66 112L86 139L106 112" fill="#fff"/><path d="M86 139l-10 35h20Z" fill="#304e87"/><path d="M55 128Q32 132 24 159L40 167Q50 147 68 145Z" fill="#f2c9a7"/><g class="armPoint"><path d="M116 128Q140 132 147 159L131 166Q122 147 105 145Z" fill="#f2c9a7"/><path class="pointer" d="M140 151L173 112" stroke="#6d4a2c" stroke-width="7" stroke-linecap="round"/></g><path d="M52 192l-6 44h32l8-37Z" fill="#3c4354"/><path d="M120 192l6 44H94l-8-37Z" fill="#3c4354"/><path class="stress" d="M30 96l-18 12M37 84L20 80M142 89l20-8" stroke="#ffcd4a" stroke-width="7"/><path class="anger" d="M147 42l10-10M152 55l16 2M32 40L20 28" stroke="#ff5b64" stroke-width="7"/></g></svg></div></div><div id="resultBubble" class="bubbleResult"><strong id="resultAnswer"></strong><span id="resultRarity" class="rar"></span></div><div class="gaugeBox">⚡ 게이지 <span id="gaugeText" style="float:right">0 / 100</span><div class="gauge"><div id="gaugeFill" class="fill" style="width:0"></div></div></div><div id="seats" class="seats"></div></div><form id="form" class="dock"><div id="timer" class="timer" style="--pct:100%"><b id="time">10.0</b></div><input id="answer" class="ans" autocomplete="off" placeholder="답을 입력하세요..."><button class="submit">제출</button></form></section><aside class="side"><div class="box"><h3>CLASS LOG</h3><div id="log" class="log"></div></div><div class="box"><h3>학생 상태</h3><div id="plist"></div></div><div class="box"><h3>규칙</h3><div class="rule">10초 안에 유효한 답을 입력.<br>오답·중복은 시간 계속.<br>시간 초과 시 ❤️ -1.<br>희귀답변은 게이지 증가.<br>마지막 2명은 FINAL DUEL.</div></div></aside></div></main><div id="overlay" class="overlay"><div class="resultBox"><div style="font-size:58px">🏆</div><h1 id="winner"></h1><p>마지막까지 살아남은 학생</p><button class="primary" onclick="restart()">다시 시작</button></div></div><script>
const Q=[{c:'카테고리 1 · K-POP',q:'한국 아이돌 그룹을 말하세요!',a:[['방탄소년단',['방탄소년단','방탄','bts'],'COMMON'],['블랙핑크',['블랙핑크','blackpink'],'COMMON'],['에스파',['에스파','aespa'],'COMMON'],['뉴진스',['뉴진스','newjeans'],'COMMON'],['세븐틴',['세븐틴','seventeen'],'UNCOMMON'],['아이브',['아이브','ive'],'UNCOMMON'],['트와이스',['트와이스','twice'],'UNCOMMON'],['샤이니',['샤이니','shinee'],'RARE'],['비투비',['비투비','btob'],'RARE'],['틴탑',['틴탑','teentop'],'EPIC'],['나인뮤지스',['나인뮤지스','9muses'],'EPIC'],['크나큰',['크나큰','knk'],'UNIQUE']]},{c:'카테고리 2 · FOOD',q:'한국 라면 제품을 말하세요!',a:[['신라면',['신라면'],'COMMON'],['짜파게티',['짜파게티'],'COMMON'],['진라면',['진라면'],'COMMON'],['너구리',['너구리'],'UNCOMMON'],['팔도비빔면',['팔도비빔면','비빔면'],'UNCOMMON'],['꼬꼬면',['꼬꼬면'],'RARE'],['참깨라면',['참깨라면'],'RARE'],['오징어짬뽕',['오징어짬뽕'],'EPIC'],['무파마',['무파마','무파마탕면'],'UNIQUE']]},{c:'카테고리 3 · WORLD',q:'나라 이름을 하나 말하세요!',a:[['대한민국',['대한민국','한국','korea'],'COMMON'],['미국',['미국','usa','america'],'COMMON'],['일본',['일본','japan'],'COMMON'],['중국',['중국','china'],'COMMON'],['필리핀',['필리핀','philippines'],'UNCOMMON'],['베트남',['베트남','vietnam'],'UNCOMMON'],['몽골',['몽골','mongolia'],'RARE'],['네팔',['네팔','nepal'],'RARE'],['부탄',['부탄','bhutan'],'EPIC'],['몰도바',['몰도바','moldova'],'EPIC'],['투발루',['투발루','tuvalu'],'UNIQUE']]}],PTS={COMMON:5,UNCOMMON:10,RARE:15,EPIC:20,UNIQUE:25},$=x=>document.getElementById(x),norm=s=>(s||'').toLowerCase().replace(/[\s\-_.·'"()]/g,'');let ps,turn,qi,used,claimed,deadline,timerId,locked,fails,catStart,duelStart;
function studentSvg(){return `<svg viewBox="0 0 160 190"><g stroke="#2a2025" stroke-width="5" stroke-linejoin="round"><ellipse cx="80" cy="63" rx="42" ry="41" fill="#f6d0aa"/><path d="M46 44Q80 18 114 44" stroke="#e5b98e" stroke-width="4" fill="none"/><path d="M52 38l7-8M68 31l3-9M90 31l-2-9M106 38l-7-8" stroke="#d7a67e" stroke-width="3"/><g class="normalEyes"><rect x="56" y="57" width="10" height="16" rx="4" fill="#211e24"/><rect x="94" y="57" width="10" height="16" rx="4" fill="#211e24"/></g><g class="failEyes" stroke="#522c37"><path d="M54 59l14 14M68 59L54 73M92 59l14 14M106 59L92 73"/></g><ellipse class="blush" cx="51" cy="81" rx="12" ry="7" fill="#ff7b80" stroke="none"/><ellipse class="blush" cx="109" cy="81" rx="12" ry="7" fill="#ff7b80" stroke="none"/><path class="normalMouth" d="M70 87q10 9 20 0" fill="none"/><path class="panic" d="M70 87q10-10 20 0q-10 13-20 0Z" fill="#8d3340"/><path class="happy" d="M55 63q5 8 10 0M95 63q5 8 10 0M69 88q11 14 22 0" fill="none"/><path class="sweat" d="M118 50q9 13 0 22q-10-8 0-22Z" fill="#63dfff" stroke="#2d7a9c"/><path d="M50 108Q80 96 110 108L120 164Q80 178 40 164Z" fill="#263f70"/><path d="M61 103L80 128L99 103" fill="#fff"/><path d="M80 128l-9 27h18Z" fill="#d34b59"/><path d="M47 118q-18 6-19 25l16 4q6-14 18-15Z" fill="#f6d0aa"/><path d="M113 118q18 6 19 25l-16 4q-6-14-18-15Z" fill="#f6d0aa"/><path d="M43 164l-2 24h31l7-18Z" fill="#303845"/><path d="M117 164l2 24H88l-7-18Z" fill="#303845"/></g></svg>`}function deskSvg(){return `<svg class="deskSvg" viewBox="0 0 180 90"><g stroke="#4a2e1f" stroke-width="5"><path d="M18 24h144l-8 35H26Z" fill="#d59a52"/><path d="M28 58h15v31H31ZM137 58h15l-3 31h-12Z" fill="#75513a"/><path d="M33 18h114l9 9H24Z" fill="#f0b96b"/><rect x="74" y="27" width="34" height="9" rx="4" fill="#d6e7f2"/><rect x="112" y="27" width="20" height="8" rx="3" fill="#68b6ff"/></g></svg>`}
function init(){ps=[['민준',1],['서연',1],['학생0716',0],['지훈',1],['다연',1],['승현',1]].map(([name,bot])=>({name,bot,lives:2,gauge:0,dead:false}));turn=2;qi=0;used=new Set();claimed=new Set();fails=0;catStart=Date.now();duelStart=0;$('log').innerHTML='';render();startTurn()}function alive(){return ps.filter(p=>!p.dead)}function next(i){do{i=(i+1)%ps.length}while(ps[i].dead&&alive().length>1);return i}function hearts(n){return'❤️'.repeat(Math.max(0,n))+'🖤'.repeat(Math.max(0,3-n))}
function renderSeats(){const root=$('seats');root.innerHTML='';ps.forEach((p,i)=>{const e=document.createElement('div');e.className='seat'+(i===turn&&!p.dead?' active':'')+(p.dead?' dead':'');e.dataset.i=i;e.innerHTML=`<div class="marker">▼</div><div class="studentWrap">${studentSvg()}</div><div class="deskLayer">${deskSvg()}</div><div class="nameplate">${i+1} ${p.name}<span class="life">${hearts(p.lives)}</span></div>`;root.appendChild(e)})}function renderSide(){$('plist').innerHTML=ps.map((p,i)=>`<div class="prow ${i===turn&&!p.dead?'current':''} ${p.dead?'dead':''}"><span>${i+1}</span><b>${p.name}</b><span>${hearts(p.lives)}</span></div>`).join('');const me=ps[2];$('gaugeText').textContent=`${me.gauge} / 100`;$('gaugeFill').style.width=Math.min(100,me.gauge)+'%'}function pointTeacher(){const t=$('teacher');t.classList.remove('point-left','point-right');if(turn<2)t.classList.add('point-left');else if(turn>3)t.classList.add('point-right')}function render(){$('cat').textContent=Q[qi].c;$('question').textContent=Q[qi].q;$('teacherSpeech').innerHTML=`지금은 <b>${turn+1}번 ${ps[turn].name}</b> 차례!`;renderSeats();renderSide();pointTeacher();$('answer').disabled=ps[turn].bot||ps[2].dead}
function setVisual(level){document.querySelectorAll('.seat').forEach((e,i)=>{e.classList.remove('nervous','hot');if(i===turn&&level==='warn')e.classList.add('nervous');if(i===turn&&level==='hot')e.classList.add('hot')});const t=$('teacher');t.classList.remove('warn','angry');if(level==='warn')t.classList.add('warn');if(level==='hot')t.classList.add('angry')}function addLog(name,ans,rar,extra=''){$('log').insertAdjacentHTML('afterbegin',`<div class="logItem"><b>${name}</b> · ${ans}<br><span class="rar ${rar}">${rar==='ONE'?'THE ONE AND ONLY':rar}</span>${extra?`<div style="color:#91a4c5;margin-top:4px">${extra}</div>`:''}</div>`)}function splash(ans,label,cls){$('resultAnswer').textContent=ans;$('resultRarity').textContent=label;$('resultRarity').className='rar '+cls;const b=$('resultBubble');b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}function lookup(v){return Q[qi].a.find(x=>x[1].some(a=>norm(a)===norm(v)))}function gain(p,pts){p.gauge+=pts;if(p.lives<3&&p.gauge>=100){p.gauge-=100;p.lives++}if(p.lives===3)p.gauge=Math.min(100,p.gauge)}function animateSeat(cls){const e=document.querySelector(`.seat[data-i="${turn}"]`);if(e){e.classList.add(cls);setTimeout(()=>e.classList.remove(cls),700)}}function accept(a){const p=ps[turn],[name,aliases,r]=a;used.add(name);let pts=PTS[r],label=r,cls=r;if(r==='UNIQUE'&&!claimed.has(name)){claimed.add(name);pts=50;label='THE ONE AND ONLY';cls='ONE'}gain(p,pts);splash(name,`${label} · +${pts} ⚡`,cls);animateSeat('correct');addLog(p.name,name,cls,'같은 문제에서 재사용 불가');fails=0;renderSide()}
function startTurn(){if(alive().length<=1)return finish();if(Date.now()-catStart>60000||fails>=3){qi=(qi+1)%Q.length;used.clear();fails=0;catStart=Date.now()}locked=false;setVisual('normal');const duel=alive().length===2;if(duel&&!duelStart)duelStart=Date.now();const sec=duel?(Date.now()-duelStart>60000?5:7):10;deadline=performance.now()+sec*1000;clearInterval(timerId);timerId=setInterval(tick,50);render();if(ps[turn].bot)setTimeout(botPlay,1000+Math.random()*1600);else $('answer').focus()}function tick(){const total=alive().length===2?(Date.now()-duelStart>60000?5:7):10,left=Math.max(0,(deadline-performance.now())/1000);$('time').textContent=left.toFixed(1);$('timer').style.setProperty('--pct',`${Math.max(0,left/total*100)}%`);if(left<=2.8)setVisual('hot');else if(left<=6)setVisual('warn');else setVisual('normal');if(left<=0)timeout()}function timeout(){if(locked)return;locked=true;clearInterval(timerId);setVisual('hot');const p=ps[turn];p.lives--;fails++;animateSeat('fail');$('teacher').classList.add('angry');$('teacherSpeech').innerHTML=`<b>시간 초과!</b><br>${p.name}, 라이프 -1`;splash('TIME OUT','❤️ -1','ONE');addLog(p.name,'TIME OUT','ONE','라이프 -1');if(p.lives<=0)p.dead=true;renderSide();setTimeout(()=>{turn=next(turn);startTurn()},1200)}function submit(v){if(locked||ps[turn].bot||ps[2].dead)return;const a=lookup(v);if(!a){splash('NOT ACCEPTED','시간은 계속 흐릅니다','COMMON');$('answer').select();return}if(used.has(a[0])){splash('ALREADY TAKEN','다른 답을 입력하세요','COMMON');$('answer').select();return}locked=true;clearInterval(timerId);accept(a);$('answer').value='';setTimeout(()=>{turn=next(turn);startTurn()},1000)}function botPlay(){if(locked||!ps[turn].bot)return;if(Math.random()<.18)return;const pool=Q[qi].a.filter(a=>!used.has(a[0]));if(!pool.length)return;locked=true;clearInterval(timerId);accept(pool[Math.floor(Math.random()*pool.length)]);setTimeout(()=>{turn=next(turn);startTurn()},900)}function finish(){clearInterval(timerId);const w=alive()[0]||ps[2];$('winner').textContent=`${w.name} 우승`;$('overlay').classList.add('show')}function restart(){$('overlay').classList.remove('show');init()}$('form').addEventListener('submit',e=>{e.preventDefault();submit($('answer').value.trim())});init();
</script></body></html>
