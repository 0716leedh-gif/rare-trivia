<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RARE Trivia</title><style>*{box-sizing:border-box}body{margin:0;background:#070912;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(760px,94vw);text-align:center}.logo{font-size:clamp(64px,14vw,120px);font-weight:1000;letter-spacing:-.08em}.logo b{color:#55ddff}.tag{color:#aeb8ca;font-size:20px;margin:16px 0 42px}.card{background:#111725;border:1px solid #273149;border-radius:28px;padding:28px}.category{color:#55ddff;font-size:12px;font-weight:900;letter-spacing:.18em}.q{font-size:30px;font-weight:900;margin:12px 0 25px}.timer{font-size:80px;font-weight:1000}.status{display:flex;justify-content:space-between;margin:20px 0}.bar{height:10px;background:#090c14;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#765cff,#55ddff)}form{display:grid;grid-template-columns:1fr 100px;gap:10px;margin-top:28px}input,button{border-radius:16px;padding:17px;font:inherit}input{background:#090d17;color:white;border:1px solid #34415c}button{border:0;background:#fff;color:#090b12;font-weight:900;cursor:pointer}.result{height:70px;display:grid;place-items:center;font-size:23px;font-weight:1000}.small{color:#8995aa;font-size:13px;margin-top:18px}</style></head><body><main class="app"><div class="logo">RARE<b>:</b></div><div class="tag">남들이 생각하지 못한 답을 찾아라.</div><section class="card"><div class="category">CATEGORY · K-POP</div><div class="q">한국 아이돌 그룹을 말하세요</div><div id="timer" class="timer">10.0</div><div id="result" class="result">YOUR TURN</div><div class="status"><span id="life">❤️❤️</span><span id="gt">⚡ 0 / 100</span></div><div class="bar"><div id="fill" class="fill"></div></div><form id="f"><input id="a" autofocus autocomplete="off" placeholder="답변 입력"><button>제출</button></form><div class="small">RARE Survival Trivia · Web Alpha</div></section></main><script>const data={"방탄소년단":["bts","방탄","방탄소년단","COMMON",5],"블랙핑크":["blackpink","블랙핑크","COMMON",5],"세븐틴":["seventeen","세븐틴","UNCOMMON",10],"샤이니":["shinee","샤이니","RARE",15],"틴탑":["teentop","틴탑","EPIC",20],"크나큰":["knk","크나큰","UNIQUE",25]};let life=2,g=0,end=performance.now()+10000,used=new Set();const $=x=>document.getElementById(x),norm=s=>s.toLowerCase().replace(/\s/g,'');function reset(){end=performance.now()+10000}function render(){$('life').textContent='❤️'.repeat(life)+'🖤'.repeat(Math.max(0,3-life));$('gt').textContent='⚡ '+g+' / 100';$('fill').style.width=g+'%'}setInterval(()=>{let n=Math.max(0,(end-performance.now())/1000);$('timer').textContent=n.toFixed(1);if(n<=0){life--;$('result').textContent='TIME OUT · LIFE -1';if(life<=0){life=2;g=0;used.clear();$('result').textContent='GAME OVER · 다시 시작'}render();reset()}},50);$('f').onsubmit=e=>{e.preventDefault();let v=norm($('a').value),hit=null,name='';for(const [k,x] of Object.entries(data)){if(x.slice(0,-2).some(z=>norm(z)===v)){hit=x;name=k;break}}if(!hit){$('result').textContent='NOT ACCEPTED · 시간은 계속';$('a').select();return}if(used.has(name)){$('result').textContent='ALREADY TAKEN';$('a').select();return}used.add(name);let rarity=hit[hit.length-2],pts=hit[hit.length-1];g+=pts;if(g>=100&&life<3){g-=100;life++}g=Math.min(100,g);$('result').textContent=name+' · '+rarity+' +'+pts+'⚡';$('a').value='';render();reset()};render()</script></body></html>
