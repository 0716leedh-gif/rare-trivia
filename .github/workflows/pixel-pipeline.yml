name: Pixel art pipeline experiment

on:
  push:
    branches: [experiment/pixel-pipeline]
    paths:
      - 'tools/pixel/**'
      - '.github/workflows/pixel-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pixel-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RARE SCHOOL experiment
        uses: actions/checkout@v6
        with:
          ref: experiment/pixel-pipeline

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile, validate and render bald student with Pixelbolt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pixelbolt
          npx -y pixelbolt@0.11.0 compile tools/pixel/rare-student.poses.json --out artifacts/pixelbolt/rare-student.json
          npx -y pixelbolt@0.11.0 validate artifacts/pixelbolt/rare-student.json
          npx -y pixelbolt@0.11.0 render artifacts/pixelbolt/rare-student.json --out artifacts/pixelbolt/rendered
          test -s artifacts/pixelbolt/rendered/frames/stand.png
          test -s artifacts/pixelbolt/rendered/rare-school-bald-student.png

      - name: Checkout PixelFX 0.3.0 source at pinned commit
        uses: actions/checkout@v6
        with:
          repository: patch-gg/pixelfx
          ref: a84159688af3ca37a4be05a0d422b94451b2e24e
          path: .vendor/pixelfx

      - name: Render RARE SCHOOL candidate VFX and sprite sheets
        shell: bash
        working-directory: .vendor/pixelfx
        run: |
          set -euo pipefail
          npm ci
          node tools/render.mjs ui/countdown --gif
          node tools/render.mjs ui/heart-lost --gif
          node tools/render.mjs ui/confetti --gif
          node tools/sheets.mjs ui/countdown ui/heart-lost ui/confetti
          test -s sheets/ui/countdown.png
          test -s sheets/ui/countdown.json
          test -s sheets/ui/heart-lost.png
          test -s sheets/ui/heart-lost.json
          test -s sheets/ui/confetti.png
          test -s sheets/ui/confetti.json

      - name: Collect outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pixelfx/records artifacts/pixelfx/sheets
          if [ -d .vendor/pixelfx/records ]; then
            cp -R .vendor/pixelfx/records/. artifacts/pixelfx/records/
          fi
          cp -R .vendor/pixelfx/sheets/ui artifacts/pixelfx/sheets/
          find artifacts -maxdepth 6 -type f -print

      - name: Publish generated assets to experiment branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/pixelbolt
          cp artifacts/pixelbolt/rendered/frames/stand.png assets/pixelbolt/student_idle.png
          cp artifacts/pixelbolt/rendered/frames/idle-inhale.png assets/pixelbolt/student_idle_inhale.png
          cp artifacts/pixelbolt/rendered/frames/idle-exhale.png assets/pixelbolt/student_idle_exhale.png
          cp artifacts/pixelbolt/rendered/frames/hurt-recoil.png assets/pixelbolt/student_hurt_recoil.png
          cp artifacts/pixelbolt/rendered/frames/hurt-recover.png assets/pixelbolt/student_hurt_recover.png
          cp artifacts/pixelbolt/rendered/rare-school-bald-student.png assets/pixelbolt/rare-school-bald-student.png
          cp artifacts/pixelbolt/rendered/rare-school-bald-student.atlas.json assets/pixelbolt/rare-school-bald-student.atlas.json
          for fx in countdown heart-lost confetti; do
            mkdir -p "assets/pixelfx/ui/$fx"
            cp "artifacts/pixelfx/sheets/ui/$fx.png" "assets/pixelfx/ui/$fx/$fx.png"
            cp "artifacts/pixelfx/sheets/ui/$fx.json" "assets/pixelfx/ui/$fx/$fx.json"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pixelbolt assets/pixelfx/ui
          if git diff --cached --quiet; then
            echo "Generated assets unchanged"
          else
            git commit -m "Generate Pixelbolt sprites and PixelFX sheets"
            git push origin HEAD:experiment/pixel-pipeline
          fi

      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: rare-school-pixel-pipeline
          path: artifacts/
          if-no-files-found: error
