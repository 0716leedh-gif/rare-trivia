name: Deploy RARE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild classroom image as a real binary asset
        shell: bash
        run: |
          set -euo pipefail
          cat assets/bg1.txt assets/bg2.txt assets/bg3.txt assets/bg4.txt | tr -d '\n\r\t ' | base64 --decode > assets/classroom.webp
          test -s assets/classroom.webp
          size=$(wc -c < assets/classroom.webp)
          echo "classroom.webp size: $size bytes"
          if [ "$size" -lt 10000 ]; then
            echo "classroom.webp is unexpectedly small" >&2
            exit 1
          fi
          sig=$(xxd -p -l 4 assets/classroom.webp)
          riff=$(xxd -p -s 8 -l 4 assets/classroom.webp)
          echo "signature: $sig / $riff"
          if [ "$sig" != "52494646" ] || [ "$riff" != "57454250" ]; then
            echo "Invalid WebP signature" >&2
            exit 1
          fi
          file assets/classroom.webp
          cat > assets/scene.js <<'JS'
          window.addEventListener('DOMContentLoaded', () => {
            const img = document.getElementById('sceneImg');
            if (!img) return;
            img.onload = () => console.log('RARE classroom asset loaded', img.naturalWidth, img.naturalHeight);
            img.onerror = (e) => console.error('RARE classroom image failed to load', e);
            img.src = 'assets/classroom.webp?v=1';
          });
          JS

      - name: Setup Node.js for PixelFX
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout pinned PixelFX
        uses: actions/checkout@v6
        with:
          repository: patch-gg/pixelfx
          ref: a84159688af3ca37a4be05a0d422b94451b2e24e
          path: .vendor/pixelfx

      - name: Export PixelFX sprite sheets
        shell: bash
        working-directory: .vendor/pixelfx
        run: |
          set -euo pipefail
          npm ci
          node tools/sheets.mjs ui/countdown ui/heart-lost ui/confetti
          test -s sheets/ui/countdown.png
          test -s sheets/ui/heart-lost.png
          test -s sheets/ui/confetti.png

      - name: Install PixelFX assets into game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/pixelfx/ui/{countdown,heart-lost,confetti}
          for fx in countdown heart-lost confetti; do
            cp ".vendor/pixelfx/sheets/ui/${fx}.png" "assets/pixelfx/ui/${fx}/${fx}.png"
            cp ".vendor/pixelfx/sheets/ui/${fx}.json" "assets/pixelfx/ui/${fx}/${fx}.json"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="assets/pixelfx-runtime.js?v=2"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
          p.write_text(s)
          PY
          grep -q 'pixelfx-runtime.js' index.html
          find assets/pixelfx -maxdepth 4 -type f -print
          rm -rf .vendor

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
