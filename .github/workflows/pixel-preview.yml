name: Build PixelFX gameplay preview

on:
  push:
    branches: [experiment/pixel-pipeline]
    paths:
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'art-preview.html'
      - 'assets/**'
      - '.github/workflows/pixel-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RARE SCHOOL experiment
        uses: actions/checkout@v6

      - name: Rebuild classroom image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets
          cp index.html app.js style.css art-preview.html site/
          cp -R assets/. site/assets/
          cat assets/bg1.txt assets/bg2.txt assets/bg3.txt assets/bg4.txt | tr -d '\n\r\t ' | base64 --decode > site/assets/classroom.webp
          test -s site/index.html
          test -s site/app.js
          test -s site/style.css
          test -s site/assets/classroom.webp

      - name: Static sanity checks
        shell: bash
        run: |
          set -euo pipefail
          node --check site/app.js
          if [ -f site/assets/pixelfx-runtime.js ]; then node --check site/assets/pixelfx-runtime.js; fi
          python3 -m http.server 4173 --directory site >/tmp/rare-preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/art-preview.html >/dev/null

      - name: Upload safe preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: rare-school-experiment-preview
          path: site/
          if-no-files-found: error
